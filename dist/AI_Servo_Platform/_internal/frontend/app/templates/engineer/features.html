{% extends "base.html" %}
{% block title %}特徵監控 — AI SERVO PLATFORM{% endblock %}
{% block content %}
<h3 class="fw-bold mb-3"><i class="fa-solid fa-chart-line text-info me-2"></i>特徵監控 (Feature Engineering & Residues)</h3>
<div class="glass-card p-4">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="p-3 bg-dark rounded border border-info">
                <div class="text-muted fs-7 mb-1">頻域 1x 頻率振幅 (fft_1x_amp)</div>
                <div class="fs-4 fw-bold text-info" id="feat-fft1x">0.012</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-3 bg-dark rounded border border-warning">
                <div class="text-muted fs-7 mb-1">機械共振振幅 (resonance_amp)</div>
                <div class="fs-4 fw-bold text-warning" id="feat-resonance">0.003</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="glass-card p-3 bg-dark rounded border border-success">
                <div class="text-muted fs-7 mb-1">數位雙生位置殘差 (digital_twin_pos_residual)</div>
                <div class="fs-4 fw-bold text-success" id="feat-dt-residual">0.021 mm</div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateRealtimeFeatures() {
        fetch('/operator/api/v1/system/data_sources')
            .then(r => r.json()).then(srcData => {
                const activeId = srcData.active_source?.id || '01_Pick_and_Place';
                return fetch(FASTAPI_BASE + '/api/v1/l1/realtime?scenario_id=' + encodeURIComponent(activeId));
            })
            .then(r => r.json()).then(d => {
                const rt = d.motor_realtime || {};
                const res = rt.position_residual_mm ?? 0.021;
                const dv = rt.dv_point ?? 0.1;
                
                document.getElementById('feat-dt-residual').textContent = res.toFixed(4) + ' mm';
                document.getElementById('feat-fft1x').textContent = (0.010 + dv * 0.02).toFixed(4);
                document.getElementById('feat-resonance').textContent = (0.002 + dv * 0.01).toFixed(4);
            }).catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', () => {
        startHmiDynamicTimer(updateRealtimeFeatures);
    });
</script>
{% endblock %}
