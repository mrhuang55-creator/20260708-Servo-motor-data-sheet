{% extends "base.html" %}
{% block title %}您無權限操作 — AI SERVO PLATFORM{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center py-5 text-center">
    <div class="display-1 text-danger mb-3"><i class="fa-solid fa-user-slash"></i></div>
    <h2 class="fw-bold text-danger">您無權限操作</h2>
    <p class="text-muted max-w-md my-3">
        您的帳號角色 (<strong>{{ user.role if user else '未登入' }}</strong>) 沒有權限存取此功能或執行此操作。<br>
        請切換具備相應權限之帳號，或聯繫系統管理者升級權限。
    </p>
    <a href="javascript:history.back()" class="btn btn-outline-light mt-3 px-4 py-2"><i class="fa-solid fa-arrow-left me-2"></i>返回上一頁</a>
</div>
{% endblock %}
