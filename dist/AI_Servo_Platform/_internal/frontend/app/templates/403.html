{% extends "base.html" %}
{% block title %}403 權限不足 — AI SERVO PLATFORM{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center py-5 text-center">
    <div class="display-1 text-danger mb-3"><i class="fa-solid fa-user-slash"></i></div>
    <h2 class="fw-bold">403 存取權限不足 (Forbidden)</h2>
    <p class="text-muted max-w-md my-3">
        您的帳號角色 ({{ user.role if user else '未登入' }}) 沒有存取此頁面或執行此操作的權限。<br>
        如需提升權限，請聯繫系統管理者。
    </p>
    <a href="javascript:history.back()" class="btn btn-outline-light mt-3"><i class="fa-solid fa-arrow-left me-2"></i>返回上一頁</a>
</div>
{% endblock %}
