version: '3.8'

services:
  backend:
    build: .
    container_name: phm_backend
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always

  frontend:
    build: .
    container_name: phm_frontend
    command: python3 frontend/run_flask.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: phm_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx_phm.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    restart: always
