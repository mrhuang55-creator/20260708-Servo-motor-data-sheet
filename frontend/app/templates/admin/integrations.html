{% extends "base.html" %}
{% block title %}系統整合狀態 — AI SERVO PLATFORM{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2 glass-card p-3 border-info">
    <div>
        <h4 class="fw-bold mb-1 text-light"><i class="fa-solid fa-network-wired text-primary me-2"></i>系統整合與通訊健康 (System Integrations & Maintenance)</h4>
        <p class="text-muted fs-7 mb-0">實時監控 TSN 通訊延遲、FastAPI 引擎狀態與一鍵備份 SQLite 持久化資料庫</p>
    </div>
    <button class="btn btn-warning btn-sm fw-bold text-dark" onclick="triggerDbBackup()"><i class="fa-solid fa-database me-1"></i>立即備份系統資料庫 (Backup SQLite)</button>
</div>

<div class="glass-card p-4">
    <div class="row g-3">
        <div class="col-md-6">
            <div class="p-3 bg-dark rounded border border-secondary">
                <div class="fw-bold mb-1 text-light">FastAPI (server.py) 分析後端引擎</div>
                <div class="fs-7 text-success" id="integ-fastapi-addr"><i class="fa-solid fa-circle-check me-1"></i>載入中… (ONLINE)</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="p-3 bg-dark rounded border border-secondary">
                <div class="fw-bold mb-1 text-light">三菱 MR-J5 SLMP MC 協議連線品質</div>
                <div class="fs-7 text-success" id="integ-tsn-status"><i class="fa-solid fa-network-wired me-1"></i>TSN ONLINE (延遲載入中…)</div>
            </div>
        </div>
    </div>
</div>

<script>
    function triggerDbBackup() {
        showSafetyConfirm(
            "系統資料庫一鍵備份確認",
            `<div class='alert alert-warning p-3 mb-0'><i class='fa-solid fa-database me-2'></i>確定要立即打包並匯出當前全量 SQLite 持久化資料庫 (Data Sources, Approvals, Fallback Logs) 嗎？</div>`,
            "立即執行備份",
            "btn-warning text-dark",
            function() {
                fetch(FASTAPI_BASE + '/api/v1/system/backup_db', { method: 'POST' })
                    .then(r => r.json()).then(d => {
                        alert(`✅ ${d.message || '備份成功！'}\n備份快照已安全存入: test_repository/backups/${d.backup_filename || ''}`);
                    }).catch(() => {
                        alert("❌ 備份請求失敗，請確認後端服務離線或網路通暢。");
                    });
            }
        );
    }

    document.addEventListener('DOMContentLoaded', function() {
        const addrEl = document.getElementById('integ-fastapi-addr');
        if (addrEl) {
            addrEl.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i>${FASTAPI_BASE} (ONLINE)`;
        }

        fetch(FASTAPI_BASE + '/api/v1/hardware/status')
            .then(r => r.json()).then(d => {
                const lat = d.tsn_latency_ms ?? 1.2;
                const el = document.getElementById('integ-tsn-status');
                if (el) {
                    el.innerHTML = `<i class="fa-solid fa-network-wired me-1"></i>TSN ${d.status || 'ONLINE'} (即時延遲 ${lat} ms)`;
                }
            }).catch(() => {});
    });
</script>
{% endblock %}
